  block: B
  tier: 0
  unit: pct
  value_format: pct
  freq: M
  ts_convention: month_start         # ts = Model Output Date (monthly, 1st)
  release_schedule: monthly (early following month)
  expected_start: "1982-01-01"       # workbook history ≈537 monthly rows
  sanity_min: -2.0                   # deflationary era expectations went slightly negative
  sanity_max: 10.0                   # early-80s peak ~8-9
  primary_source: "CLEVELAND:inflation-expectations.csv (XLSX) sheet 'Expected Inflation'"
  secondary_source: null
  tolerance: null
  active: 1
  # 1y model expectation — the short anchor of the expectation curve.

