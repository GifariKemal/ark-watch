# =====================================================================================
# ark-watch — config/series_registry.yaml — PART 1: BLOCKS A-C
# Machine-readable source of truth for the series that live in `raw_observations`
# (do not rename/reorder fields without a migration).
#
# HOUSED ELSEWHERE, EXCLUDED FROM THIS REGISTRY:
#   * COT (positioning)      → `cot_raw`; contracts in config/cot_contracts.yaml
#   * Flows (ETF/physical)   → `flows_daily` / `flows_periodic`
#   * Calendar (events)      → `events`
#   * price instruments      → `instrument_prices`
#   * Snapshot & computed paths:
#       - ZQ(305)/SR1(8463)/SR3(8462)/ESR(10247) settlements → `cme_settlements`
#       - MPT XLSX + FedWatch-DIY + official FedWatch view    → `fedwatch_snapshots`
#       - ECB implied path, xccy basis, slope, CPI 3m-ann,
#         REACCEL overlay, gold↔RY divergence, z/momentum     → `computed_signals`
#     (living in their own tables is enough — they are NOT listed row-by-row here)
#
# FIELD CONVENTIONS:
#   tier         : 0..4 taxonomy (0=official institution, 1=paid EODHD/FMP,
#                  2=free market data, 3=gray, 4=computed). Tier = PRIMARY's.
#   unit / value_format : 'pct' = value already in percent (4.67 = 4.67%) ·
#                  'fraction' = decimal (0.0467) · 'level' = raw non-percent number
#                  (index, USD/bbl) — guards against DGS10=46.7 mixups.
#   freq         : D | W | M | Q | A | E (event-driven, e.g. per MPC meeting).
#   ts_convention (ts stored UTC, displayed WIB — EDT/EST aware):
#                  et_close       = observation is that day's close (ET)
#                  obs_day        = effective rate/value for day-ts, published T+1
#                  effective_date = ts = date the new rate takes effect (not the
#                                  announcement date)
#                  report_month   = ts = reference month; release date → release_ts
#                  target_month   = ts = predicted month (nowcasts); vintage_ts = the
#                                  nowcast date
#   expected_start : historical depth floor (min_ts >= expected_start). Historical
#                  dates come from FRED metadata / research knowledge, marked ±
#                  (unconfirmed); the backfill CONFIRMS and may correct them.
#   sanity_min/max : plausibility gate (ingest + backfill). Ranges are deliberately
#                  loose (avoid false alarms during full backfill) while still catching
#                  digit transposition / unit mixups (the PBoC case study).
#   tolerance    : primary-vs-secondary cross-validation threshold. null =
#                  no valid LEVEL comparator (different semantics/product) → cross-
#                  validate direction/derivatives instead, explained per-series.
#
# series_id = stable ark-watch handle; the endpoint mnemonic lives in `primary_source`
# (e.g. FRED:DALLAS_TRIM_1M → fetches FRED:PCETRIM1M158SFRBDAL; CLEVE:NOWCAST → the
# Cleveland Fed JSON file).
#
# Part 1 = blocks A-C (27 entries). Blocks D-F live in
# series_registry_blocks_d-f.yaml.
# =====================================================================================

# =====================================================================================
# --- Policy, Rates & Dollar --------------------------------------------------
# + 12 serial series below (DFF, IORB, SOFR, DGS2/10/30, T10Y3M, DTWEXBGS, ECBDFR,
#   POLICY_BOE, THREEFYTP10, CLEVE:NOWCAST) + official Treasury par curve per tenor.
#   ZQ/SR1/ESR settlements, MPT, implied path, xccy → their own tables.
#   DXY as an instrument → `instrument_prices`; listed here only as a DTWEXBGS
#   secondary (DIFFERENT index — not a level comparator).
#
# Treasury par curve (XML daily_treasury_yield_curve) is registered PER-TENOR
# only where it adds value: 1.5 MONTH (no FRED equivalent), plus 7Y & 20Y (Treasury =
# official curve; FRED DGS7/DGS20 as secondary). 4Y is inactive (Treasury publishes no
# 4Y tenor). 2/10/30Y are NOT duplicated: they already live as FRED:DGS2/DGS10/DGS30,
# and the XML cross-checks via the two-path slope identity.
# =====================================================================================

- series_id: FRED:DFF
  name: Fed funds effective rate (EFFR)
  block: A
  tier: 0
  unit: pct
  value_format: pct
  freq: D
  ts_convention: obs_day          # effective rate for day-ts, published T+1 morning ET
  release_schedule: "business days; value for day-T published T+1 morning ET (NY Fed ~09:00)"
  expected_start: "1954-07-01"    # FRED metadata ±
  sanity_min: 0.0                 # policy rates in the data era never go negative; EFFR has never been <0
  sanity_max: 23.0                # Volcker-era 1981 daily peak ~19-20 + the stored 1981-82 extremes
                                  # (round-2: 56 stored rows outside the old 22 bound — all genuine)
  primary_source: FRED:DFF
  secondary_source: FMP:federalFunds
  tolerance: 0.01                 # 1bp — both sources quote the same effective rate
  active: 1
  calendar_family: "FED INTEREST RATE DECISION"
  # Fed funds effective rate — realized overnight policy rate; Policy pillar input + FedWatch anchor.

- series_id: FRED:IORB
  name: Interest on reserve balances
  block: A
  tier: 0
  unit: pct
  value_format: pct
  freq: D
  ts_convention: obs_day          # administrative rate in effect on day-ts
  release_schedule: business days; changes only when the Fed sets it (new maintenance period)
  expected_start: "2021-07-01"    # FRED metadata ± — IORB replaced IOER; IOER
                                  # (2008-10-09 ±) is a separate backfill if longer
                                  # history is needed
  sanity_min: 0.0                 # administrative rate cannot sensibly be negative
  sanity_max: 10.0                # follows the FFR target range; history 2021- 0.15..4.65; wide margin
  primary_source: FRED:IORB
  secondary_source: null          # no secondary; internal input to liquidity-fiscal (SOFR−IORB)
  tolerance: null
  active: 1
  # Admin rate paid on reserves — floor-system anchor; SOFR−IORB spread input (liquidity-fiscal).

- series_id: FRED:SOFR
  name: SOFR (secured overnight financing rate)
  block: A
  tier: 0
  unit: pct
  value_format: pct
  freq: D
  ts_convention: obs_day          # SOFR for day-T is published ~08:00 ET on T+1
  release_schedule: "business days; T+1 morning ET (~08:00)"
  expected_start: "2018-04-02"    # FRED metadata ± — first SOFR publication
  sanity_min: 0.0                 # collateralized US repo has never gone negative
  sanity_max: 10.0                # Sep-2019 spike 5.25 & Sep-Oct-2023 ~5.4; 10 = extreme-spike margin
  primary_source: FRED:SOFR
  secondary_source: EODHD:/rates/reference-rates
  tolerance: 0.01                 # 1bp — same fixing
  active: 1
  # Repo funding rate (secured) — funding-stress spread legs + liquidity pulse; pairs with the P1–P99 percentiles.

- series_id: FRED:DGS2
  name: Treasury yield 2Y (constant maturity)
  block: A
  tier: 0
  unit: pct
  value_format: pct
  freq: D
  ts_convention: et_close         # CMT = OTC market close yield; on FRED the same ET evening
  release_schedule: "business days; curve closes ~15:30 ET"
  expected_start: "1976-06-01"    # FRED metadata ±
  sanity_min: 0.0                 # modern nominal yields implausibly <0; Japan-style negatives never occurred in US CMT
  sanity_max: 17.0                # Sep-1981 daily peak ~16.9 (FRED DGS2); 17 so full backfill does not false-alarm
  primary_source: FRED:DGS2
  secondary_source: FMP:/stable/treasury-rates
  tolerance: 0.02                 # 2bp — matches the two-path slope identity threshold
  active: 1
  # 2Y yield — front-end policy expectation; short leg of the 2s10s slope check (pillars).

- series_id: FRED:DGS10
  name: Treasury yield 10Y (constant maturity)
  block: A
  tier: 0
  unit: pct
  value_format: pct
  freq: D
  ts_convention: et_close         # same as DGS2
  release_schedule: "business days; curve closes ~15:30 ET"
  expected_start: "1962-01-02"    # first FRED observation
  sanity_min: 0.0                 # nominal yield outside the range is implausible; 1981 peak ~15.8
  sanity_max: 16.0                # nominal yield outside the range is implausible; 1981 peak ~15.8 stored
  primary_source: FRED:DGS10
  secondary_source: FMP:/stable/treasury-rates
  tolerance: 0.02                 # 2bp, same as DGS2
  active: 1
  # 10Y benchmark — DFII10 ≈ DGS10−T10YIE identity gate + brief overnight-watch line.

- series_id: FRED:DGS30
  name: Treasury yield 30Y (constant maturity)
  block: A
  tier: 0
  unit: pct
  value_format: pct
  freq: D
  ts_convention: et_close         # same as DGS2
  release_schedule: "business days; curve closes ~15:30 ET"
  expected_start: "1977-02-28"    # FRED metadata ±; KNOWN GAP 2002-02-18..2006-02-08
                                  # (30Y bond issuance suspended) — a structural gap,
                                  # not harvester data loss
  sanity_min: 0.0                 # same as DGS10
  sanity_max: 16.0                # 1981 peak ~15 (FRED DGS30); 16 margin
  primary_source: FRED:DGS30
  secondary_source: FMP:/stable/treasury-rates
  tolerance: 0.02                 # 2bp, same as DGS2
  active: 1
  # 30Y long end — curve-shape anchor; the slowest tenor in the yield-complex context.

- series_id: FRED:T10Y3M
  name: 3M–10Y curve spread
  block: A
  tier: 0
  unit: pct
  value_format: pct
  freq: D
  ts_convention: et_close         # derivative of the close curve
  release_schedule: business days; follows the CMT release
  expected_start: "1982-01-04"    # FRED metadata ± — tied to the start of the secondary 3M bill series
  sanity_min: -3.0                # deepest historical inversion ~-2 to -2.4 (1980s; 2023 ~-1.9); -3 margin
  sanity_max: 6.0                 # historical peak ~+4 (2009-10 recovery era) + stored 1980s extremes
  primary_source: FRED:T10Y3M
  secondary_source: FMP:/stable/treasury-rates (spread computed as 10y−3m from the response)
  tolerance: 0.03                 # 3bp — secondary recomputes from two legs, slightly looser
  active: 1
  # 3M–10Y curve spread — recession-watch curve; Policy pillar A z-score input.

- series_id: FRED:DTWEXBGS
  name: Dollar index trade-weighted (broad)
  block: A
  tier: 0
  unit: index
  value_format: level
  freq: D
  ts_convention: obs_day          # index for day-T published ~16:15 ET T+1 (H.10/FRED route)
  release_schedule: business days; T+1 afternoon ET
  expected_start: "2006-01-02"    # FRED metadata ±
  sanity_min: 85.0                # 2006- low ~94.5 (2011); 85 = wide anti-false-alarm margin
  sanity_max: 150.0               # high ~130 (2022); 150 margin for further dollar gains
  primary_source: FRED:DTWEXBGS
  secondary_source: "EODHD:DXY.INDX / Yahoo:DX-Y.NYB (gray-eligible §10)"
  tolerance: null                 # DXY ≠ DTWEXBGS (different basket & basis) — direction/Δ20d cross-check only, never level
  max_age_days: 12  # daily index published weekly (Monday) for the prior week
  active: 1
  # Trade-weighted dollar — dollar-smile STRONG/WEAK/FLAT (20d momentum) + FX-majors context.

- series_id: FRED:ECBDFR
  name: ECB deposit facility rate
  block: A
  tier: 0
  unit: pct
  value_format: pct
  freq: D
  ts_convention: effective_date   # ts = date the rate takes effect; announcement date → release_ts
  release_schedule: "business days; changes only after ECB decisions (~8×/year, Thursday 14:15 CET)"
  expected_start: "1999-01-04"    # FRED metadata ± — start of the euro
  sanity_min: -1.0                # DFR was NEGATIVE 2014-2022 (low -0.5); lower bound -1
  sanity_max: 5.0                 # high 4.0 (2023); 5 margin
  primary_source: FRED:ECBDFR
  secondary_source: "ECB:B.U2.EUR.4F.KR.DFR.LEV | EODHD:/rates/policy-rates (EUR)"
  tolerance: 0.01                 # 1bp — the same official policy value
  active: 1
  # ECB deposit rate — the ECB policy anchor; Fed−ECB differential + implied-path context.

- series_id: EODHD:POLICY_BOE
  name: BoE Bank Rate
  block: A
  tier: 1
  unit: pct
  value_format: pct
  freq: E
  ts_convention: effective_date   # ts = date the rate takes effect; announcement → release_ts
  release_schedule: "per MPC meeting (8×/year); decision Thursday 12:00 UK"
  expected_start: "1975-01-01"    # EODHD policy-rates historical depth UNVERIFIED ±
  sanity_min: 0.0                 # Bank Rate has never been negative
  sanity_max: 20.0                # history 0.1 (2020-21) to 17 (1979); 20 margin
  primary_source: EODHD:/rates/policy-rates (GBP)
  secondary_source: null          # BOERUKM (FRED mirror) dead since 2017;
                                  # single-source policy: active freshness check
                                  # replaces cross-val
  tolerance: null
  active: 0
  # The EODHD policy-rates endpoint hosts FED+ECB only (central_bank=BOE is ignored
  # server-side; reference-rates has no UK either). Alternate routes (BoE website
  # JSON / IADB HTML scrape / FMP) pending. Inactive until a new source lands.

- series_id: FRED:THREEFYTP10
  name: Term premium 10Y (model Kim-Wright)
  block: A
  tier: 0
  unit: pct
  value_format: pct
  freq: D
  ts_convention: et_close         # daily model on the close curve
  release_schedule: business days; follows the CMT release
  expected_start: "1990-01-02"    # the Kim-Wright 1990+ series, not ACM 1961+
  sanity_min: -3.0                # negative through 2011-2021 (low ~-0.9); -3 margin
  sanity_max: 6.0                 # high-inflation era ~+3..+5; 6 margin
  primary_source: FRED:THREEFYTP10
  secondary_source: null          # no secondary; the composite derivation
                                  # ≈ DGS10−exp 10Y is usable as a direction check,
                                  # not a level comparator
  tolerance: null
  max_age_days: 12  # daily model published weekly by the Fed Board
  active: 1
  # 10Y term premium (Kim-Wright) — the "duration for free" gauge; fiscal gold-channel companion.

- series_id: CLEVE:NOWCAST
  name: CPI inflation nowcast for current month (Cleveland Fed, MoM)
  block: A
  tier: 0
  unit: pct_mom
  value_format: pct
  freq: D
  ts_convention: target_month     # ts = predicted month; many daily vintages per month →
                                  # distinguished by vintage_ts (append-only); consume as
                                  # "latest element per month"
  release_schedule: "daily (Cleveland updates after new data lands, ~10:00 ET ±)"
                                  # NO expected_start on purpose: the JSON only carries the
                                  # current chart year ± (short retention) — a depth floor is
                                  # unverifiable by construction, and Gate 3 would need a
                                  # fetch_first_ts the daily file cannot truthfully answer
  sanity_min: -1.5                # extreme historical CPI MoM ~-0.8 (2020) to +1.3
                                  # (Jun-2022); range catches wrong-decimal parses
                                  # (0.23 vs 2.3) without false alarms
  sanity_max: 2.0
  primary_source: CLEVELAND:nowcast_month.json (FusionCharts JSON; browser UA, no key; MM/DD labels + year from the subcaption)
  secondary_source: null          # unique official source — single-source with a
                                  # freshness check; the YoY/PCE/_quarter/_year
                                  # variants in the same file can be added as new
                                  # series_ids later
  tolerance: null
  active: 1
  # Current-month CPI MoM nowcast — intra-month inflation pulse between BLS releases (append-only vintages).

# --- Cleveland Fed inflation-EXPECTATIONS model (audit 2026-09-04, paket B; the
