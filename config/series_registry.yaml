# --- Cleveland yield-curve recession probability (paket C; URL pinned by the
#     research workflow 2026-09-04). Two legs of chart2_recession_probability
#     _w_forecast.csv, monthly 1960→. Live 2026-08: model estimate 24.4%,
#     +12m forecast 12.3%. ------------------------------------------------------

- series_id: CLEVE:RECPROB
  name: Yield-curve recession probability, current (Cleveland Fed model)
  block: A
  tier: 0
  unit: "percent (0-100)"
  value_format: pct
  freq: M
  ts_convention: month_start
  release_schedule: monthly (model refresh with the curve)
  expected_start: "1960-01-01"
  sanity_min: 0.0                    # probability bound
  sanity_max: 100.0
  primary_source: "CLEVELAND:chart2_recession_probability_w_forecast.csv (est leg)"
  secondary_source: null
  tolerance: null
  active: 1
  # Model-implied current recession probability from the curve — leg 1 of the
  # recession triangulation (with PHILLY:ANXIOUS + Sahm).

- series_id: CLEVE:RECPROB_F12
  name: Yield-curve recession probability, +12m forecast (Cleveland Fed model)
  block: A
  tier: 0
  unit: "percent (0-100)"
  value_format: pct
  freq: M
  ts_convention: month_start         # ts = the MODEL month (the forecast is
                                    # 12m ahead of it — the horizon lives in
                                    # the series definition, not the ts)
  release_schedule: monthly (with the model refresh)
  expected_start: "2025-07-01"       # ROLLING WINDOW: the CSV's forecast leg
                                    # only carries ~14 recent vintages (review-1
                                    # live-decode) — the series is young by
                                    # construction, NOT truncated harvesting;
                                    # depth grows one row per model month
  sanity_min: 0.0
  sanity_max: 100.0
  primary_source: "CLEVELAND:chart2_recession_probability_w_forecast.csv (forecast leg)"
  secondary_source: null
  tolerance: null
  active: 1
  # The model's FORWARD look — 12 months ahead. History note: the CSV's
  # forecast leg extends past the last model month; we store the latest
  # forecast row (its ts is the model month, not the target month — pinned
  # by the harvest storing one row per model vintage).

- series_id: CLEVE:IRP_10Y_MODEL
  name: Inflation Risk Premium 10Y, official model estimate (Cleveland Fed)
  block: B
  tier: 0
  unit: pct
  value_format: pct
  freq: M
  ts_convention: month_start
  release_schedule: monthly (early following month)
  expected_start: "1982-01-01"
  sanity_min: -2.0                    # history incl. negative-premia regimes
  sanity_max: 5.0
  primary_source: "CLEVELAND:inflation-expectations.csv (XLSX) sheet 'Ten-year Expected Chart'"
  secondary_source: null
  tolerance: null
  active: 1
  # The model's OWN inflation-risk-premium decomposition — NOT comparable
  # level-for-level with computed irp_10y (T10YIE − EXPINF_10Y ≈ −14bp),
  # which mixes in TIPS technicals; the two are companion reads of "is the
