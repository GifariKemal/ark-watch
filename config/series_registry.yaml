  sanity_min: 0.0
  sanity_max: 10.0
  primary_source: "CLEVELAND:inflation-expectations.csv (XLSX) sheet 'Expected Inflation'"
  secondary_source: null
  tolerance: null
  active: 1
  # 10y model expectation — the long anchor; T10YIE − this = inflation risk
