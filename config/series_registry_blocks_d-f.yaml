  expected_start: "1967-01-07"      # FRED API: first observation 1967-01-07
  sanity_min: 100000                 # historical min = 162,000 (1967); sub-100k never seen
                                    # in the modern era — treat as a parse error
  sanity_max: 7000000                # historical max = 6,137,000 (COVID-2020 spike); +margin
  primary_source: "FRED:ICSA"
  secondary_source: "FMP:initialClaims"
  tolerance: 1000                    # both sources carry the BLS initial print; small
                                    # differences come from weekly-revision timing
  calendar_family: "INITIAL JOBLESS CLAIMS"
  active: 1
