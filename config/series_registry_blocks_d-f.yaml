# =====================================================================
# SERIES REGISTRY — PART 2: BLOCKS D, E, F (+ flows physical series)
# =====================================================================
# Blocks A-C live in `series_registry.yaml`; cot (COT) in
# `cot_contracts.yaml`; flows (flows) in the flows_* tables; calendar
# (calendar) in the events table.
#
# Columns = exactly the `series_registry` schema:
#   series_id, name, block, tier, unit, value_format, freq,
#   ts_convention, release_schedule, expected_start, sanity_min,
#   sanity_max, primary_source, secondary_source, tolerance, active
#
# Tier taxonomy: 0 = official institution (FRED/Treasury/NY Fed/CBOE/
#   Philly/Atlanta/ECB/CFTC...) · 1 = subscription (EODHD/FMP) ·
#   2 = free market data (Yahoo/TD) · 3 = gray · 4 = synthetic/computed.
#
# ts_convention vocabulary (this file):
#   daily_et          = 1 obs/trading day, ET date stamp
#   week_ending_sat   = weekly, week ends Saturday (ICSA)
#   week_ending_wed   = weekly, week ends Wednesday (H.4.1/H.8)
#   week_ending_fri   = weekly, week ends Friday (H.10/NFCI/CMDI)
#   month_start       = monthly, ts = reference month (day 1)
#   quarter_start     = quarterly, ts = reference quarter
#   release_date      = ts = the publication date itself (vintage keying,
#                      e.g. FOMC dot plots: revisions live in the date)
# sanity bounds SCOPE (audit r3): they gate the LATEST realtime value only
#   (verify gate-2); older vintages/first-print layers may legitimately
#   exceed them. Set bounds from the FULL stored realtime range, never from
#   the current print (the ESMS/PI/PPCDF lessons).
#   year_start        = annual, ts = reference year
# Release times are written ET with season-aware WIB equivalents.
#
# ---------------------------------------------------------------------
# Source caveats:
#   1. EODHD sovereign CDS = ANNUAL Damodaran data (not daily) —
#      see EODHD:CDS_US.
#   2. EODHD funding-stress: the default response window is only ~19
#      trading days (114 rows / 6 codes) — long history must be
#      recomputed from the FRED legs.
#   3. FRED:GDPNOW stores only 1 obs/quarter (61 obs / 61 quarters) —
#      intra-quarter deltas need ALFRED vintages / the Atlanta XLSX.
#   4. FMP secondaries: the premium key returned 401 during verification
#      — all FMP secondary sources are unverified until the key works.
# ---------------------------------------------------------------------
# SCOPE NOTES:
#   - growth non-US: EA HICP/PMI, UK PMI/CPI, China PMI (Caixin/NBS)
#     arrive via the CALENDAR → `events` table.
#   - NY Fed per-snapshot families live in dedicated tables (not series here):
#     SOMA Treasury/agency per-CUSIP → soma_holdings/soma_agency_holdings;
#     desk outright ops → fed_operations; dealer survey → pd_positions;
#     WAM → soma_wam. The daily-fixing subset that fits the series model IS
#     registered here (SOFR percentiles, OBFR, EFFR percentiles+volume,
#     TGCR/BGCR, SRF/ON-RRP take-up) — harvested via ROUTES at 06:00.
#     RRPONTSYD is used as the NYFED:ONRRP_TOTAL secondary below (and the
#     NYFED RRP propositions endpoint backs FRED:RRPONTSYD itself).
#   - EUR/USD xccy basis = COMPUTED from 3 CME settlements (SR3+ESR+6E)
#     → computed_signals; not a registry series.
#   - Net liquidity (WALCL−RRP−TGA), MOVE proxy, VXN/VIX ratio →
#     computed_signals.
#   - stress-vol: CVOL (18 symbols) → `cvol_snapshots`, append-only from
#     build day (NO history). CNN Fear & Greed = stealth harvester
#     (degrade mode).
# =====================================================================

series:

# =====================================================================
# GROWTH (+ non-US sub-block)
# =====================================================================

