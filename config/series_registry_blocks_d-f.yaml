- series_id: LME:CA_STOCKS
  name: "LME Copper Warehouse Closing Stocks"
  block: H
  tier: 0
  unit: "tonne"
  value_format: fraction
  freq: D
  ts_convention: daily_et
  # Data granularity is DAILY; 'monthly' is only the publication cadence.
  # Month-M file lands ~3 business days after month-end, and the running
  # month is NOT published until the next file — so the newest point ages
  # 1 day..~5 weeks through the month (avg ~2.5 weeks). A stale copper_stocks
  # trigger reading is expected mid-month, not a source failure.
  release_schedule: "monthly LME stocks-summary XLSX (~3 business day delay after month-end; archive starts 2021-01)"
  expected_start: "2021-01-04"       # stocks-january-2021.xlsx = first file under this
                                    # naming scheme
  sanity_min: 10000                   # 2021-2026 live range ≈ 90K-380K tonnes; the floor
                                    # sits far below the historical minimum
  sanity_max: 600000                  # historical peak ~380K (2021) + 60% buffer for an
                                    # extreme regime
  primary_source: "LME:XLSX (cdn lme.com /-/media/files/data/reports-and-data/warehouse-and-stock-reports/stocks-summary/)"
  secondary_source: null
  tolerance: null
  active: 1
  # Two format eras: <=2024 sheet 'ClosingStock' with 'Stock Date' header and
  # every-other-column layout; 2026 sheet 'Closing Stock' with 'BusinessDate' and packed
  # columns → dynamic-scan parser. Cloudflare passes via curl_cffi chrome + a SHARED
  # SESSION across months (session-per-file = blocked). A not-yet-published month
  # returns a soft-404 HTML page (HTTP 200) → return []. Feeds the copper_stocks_drain
  # trigger + XCUUSD squeeze context.
