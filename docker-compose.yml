# Easypanel Compose service. No `ports:` (Traefik routes the api by domain) and
# no container_name (Easypanel names containers). Secrets come only from the
# environment set in the panel, never from a committed file.
x-app: &app
  build:
    context: .
    args:
      GIT_SHA: ${GIT_SHA:-unknown}
  image: arkwatch:latest
  init: true
  restart: unless-stopped
  # least privilege: no extra capabilities, no setuid escalation
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256  # the daemon runs up to ~5 python processes; a fork bomb stays contained
  # docker's json-file driver has no default cap: bound the container logs
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  volumes:
    - arkwatch-data:/data

services:
  daemon:
    <<: *app
    command: ["python", "-m", "arkwatch", "daemon"]
    # only the daemon sees the third-party credentials (FRED, Telegram, NLP, ...)
    env_file:
      - path: .env
        required: false
    networks:
      - default
      - ofm-net
    # Yahoo 429s and CFTC 403s the VPS datacenter IP; only allowlisted hosts use it
    # (ARKWATCH_PROXY_HOSTS, default finance.yahoo.com,publicreporting.cftc.gov)
    environment:
      ARKWATCH_PROXY: socks5h://warp:9091
    depends_on:
      - warp
    mem_limit: 1g
    # 2 vCPU host shared with Zonelab, Argus and Traefik: the 06:00-08:30 WIB job cluster
    # must not starve them
    cpus: 1.2
    # job SIGTERM grace 20 s + lane join 25 s + margin
    stop_grace_period: 90s
    healthcheck:
      # --heal: a heartbeat stale 15 min is a wedge; SIGTERM PID 1 so the restart policy acts
      # (Docker never restarts an 'unhealthy' container by itself)
      test: ["CMD", "python", "-m", "arkwatch", "healthcheck", "--heal"]
      interval: 60s
      timeout: 15s
      start_period: 120s
      retries: 3

  # OKX public WebSocket (liquidations, trades, books5): the only OKX_WS writer.
  # Direct egress: OKX answers the VPS datacenter IP (no warp, no credentials).
  # Unhealthy once no OKX_WS trade batch landed for 5 minutes; the collector
  # itself reconnects with capped backoff and REST-backfills each reconnect gap.
  okxws:
    <<: *app
    command: ["python", "-m", "arkwatch", "liquidations"]
    mem_limit: 128m  # 11 min soak incl. a forced reconnect peaked at 57 MiB
    cpus: 0.25
    stop_grace_period: 20s
    healthcheck:
      # unhealthy after 5 min without an OKX_WS batch; --heal restarts a 15-min silence
      test: ["CMD", "python", "-m", "arkwatch", "healthcheck", "okxws", "--heal"]
      interval: 60s
      timeout: 15s
      start_period: 120s
      retries: 3

  api:
    <<: *app
    command:
      ["uvicorn", "arkwatch.server.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      ARKWATCH_API_KEY: ${ARKWATCH_API_KEY:?set ARKWATCH_API_KEY in the Easypanel environment}
    # reads open SQLite with mode=ro; four audited write routes (playbook cancel, outbox
    # retry, series toggle, job enqueue) open it read-write, so stop the api too before a
    # restore. The volume stays rw on purpose - a WAL reader needs the -shm file writable.
    mem_limit: 512m
    cpus: 0.5
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    # shared bridge so Zonelab can reach http://arkwatch-api:8000 without a public
    # domain; create once on the host: docker network create arkwatch-internal
    networks:
      default: {}
      arkwatch-internal:
        aliases: [arkwatch-api]
    depends_on:
      - daemon
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Free LLM for news NLP (OpenAI-compatible, via anonymous OpenCode Zen + Kilo free pools).
  # Third-party code pinned by commit in ofm/Dockerfile. Own network (ofm-net) shared ONLY with the
  # daemon, no ports published, no env secrets, read-only rootfs. The host firewall chain OFM-EGRESS
  # (see README) additionally blocks this subnet from the VPC, other Docker networks and the
  # cloud metadata address. Daemon uses NLP_BASE_URL=http://ofm:18901/v1 and the bearer key from
  # /data/settings.json (`forwardKey`).
  ofm:
    build: ./ofm
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    volumes:
      - ofm-data:/data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    networks:
      - ofm-net
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18901/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Cloudflare WARP egress as SOCKS5 on :9091 (default network only, never
  # published). Pinned by digest. No healthcheck: shell tooling in the image
  # is not guaranteed; a dead proxy surfaces as Yahoo errors in fetch_log.
  warp:
    image: ghcr.io/mon-ius/docker-warp-socks@sha256:8f96f5e3fc4c0c997036c5ab5e50c09a97a46ccafe8f5a0b220a3d0badc5b21b
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    mem_limit: 128m
    cpus: 0.25

  # Offsite replication to Cloudflare R2. Opt-in: `docker compose --profile
  # litestream up -d` (or COMPOSE_PROFILES=litestream) once the R2 env is set.
  # `:-` not `:?` here: interpolation runs even for inactive profiles.
  litestream:
    image: litestream/litestream:0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
    profiles: ["litestream"]
    command: ["replicate", "-config", "/etc/litestream.yml"]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    # same uid as the app: a root sidecar would create root-owned -wal/-shm
    user: "10001:10001"
    environment:
      LITESTREAM_R2_ENDPOINT: ${LITESTREAM_R2_ENDPOINT:-}
      LITESTREAM_R2_BUCKET: ${LITESTREAM_R2_BUCKET:-}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
    volumes:
      - arkwatch-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    mem_limit: 256m

volumes:
  arkwatch-data:
  ofm-data:

networks:
  arkwatch-internal:
    external: true
    name: arkwatch-internal
  ofm-net:
    ipam:
      config:
        - subnet: 172.31.77.0/24
