[project]
name = "arkwatch"
version = "0.1.0"
description = "Personal US macro monitoring engine — data pipeline, signals, and a daily Telegram brief"
requires-python = ">=3.12,<3.14"
dependencies = [
    "curl_cffi>=0.7",     # impersonated HTTP for bot-gated sites (cmegroup, QuikStrike)
    "requests>=2.31",
    "pandas>=2.2",        # read_excel (calamine engine)
    "numpy>=1.26",        # lstsq (rank-deficient ECB-watch design matrix)
    "exchange-calendars>=4.13.2,<5", # session-aware intraday freshness
    "openpyxl>=3.1",      # XLSX sources (WGC, ADS, WGT, LME)
    "xlrd>=2.0",          # legacy .xls (ACM term premia — OLE2, openpyxl can't)
    "python-dotenv>=1.0", # credentials via .env only
    "websocket-client>=1.8",
    "pyyaml>=6",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "defusedxml>=0.7",     # hardened XML (fedsurvey, RSS)
    "fastapi>=0.115",      # read API for dashboards (Zonelab BFF)
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx2>=2.13",   # FastAPI TestClient (Starlette deprecates httpx)
    "ruff>=0.6",
    "litecli",        # SQLite REPL for manual inspection
    "sqlite-utils",   # one-off DB CLI
]
analytics = [
    "duckdb>=1.0",    # read-only analytical queries over the SQLite store
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs a live connection (excluded from the default run)"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["fixtures", "docs", "data", "backups", "logs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (real-bug class: unused, undefined)
    "I",    # import order
    "B",    # bugbear (mutable defaults, stdlib shadowing)
    "UP",   # modern 3.12 syntax
    "SIM",  # light simplifications
    "RET",  # clean returns
]
ignore = [
    "E501",   # long lines (URLs, SQL) handled by the formatter
    "SIM108", # forced ternary is often less clear
    "SIM102", # nested-if reads better for narrative conditions (watcher triggers)
    "B008",   # function-call defaults — common pattern here
]

[tool.ruff.format]
quote-style = "double"
